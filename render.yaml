databases:
  - name: streamhub-db
    databaseName: streamhub
    plan: free

services:
  - type: web
    name: streamhub
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    preDeployCommand: node scripts/migrate.mjs
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: streamhub-db
          property: connectionString
